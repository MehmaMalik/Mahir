<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Service Provider Registration - Mahir</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'DM Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-[#191c1d] min-h-screen pb-24">
    <!-- TopAppBar -->
    <header class="bg-white border-b border-outline-variant sticky top-0 z-50 flex justify-between items-center w-full px-4 h-16 shadow-sm">
        <div class="flex items-center gap-3">
            <button onclick="history.back()" class="text-on-surface flex items-center justify-center min-h-[48px] min-w-[48px]">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <h1 class="text-lg font-bold text-primary">Provider Registration</h1>
        </div>
        <img src="/static/images/mahir-logo.svg" height="32" alt="Mahir Logo" class="mr-2">
    </header>

    <!-- Main Registration Form -->
    <main class="max-w-md mx-auto py-6 px-4 space-y-6">
        <header class="text-center space-y-2">
            <h2 class="text-2xl font-bold text-[#006438]">Apna Profile Banayein</h2>
            <p class="text-sm text-gray-500">Provide services and start earning. Register in 2 minutes.</p>
        </header>

        <form action="/provider-skill-test" method="POST" class="bg-white border border-gray-200 rounded-2xl p-6 space-y-5 shadow-sm">
            <!-- Full Name -->
            <div class="space-y-2">
                <label for="name" class="block text-sm font-bold text-gray-700">Full Name / Pura Naam</label>
                <input type="text" id="name" name="name" required placeholder="e.g. Ustad Ahmed"
                    class="w-full h-12 px-4 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-[#1a7f4b] focus:border-[#1a7f4b]">
            </div>

            <!-- Phone Number -->
            <div class="space-y-2">
                <label for="phone" class="block text-sm font-bold text-gray-700">Mobile Number / Phone</label>
                <input type="tel" id="phone" name="phone" required placeholder="e.g. 03001234567"
                    class="w-full h-12 px-4 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-[#1a7f4b] focus:border-[#1a7f4b]">
            </div>

            <!-- Service Type Dropdown -->
            <div class="space-y-2">
                <label for="service_type" class="block text-sm font-bold text-gray-700">Service Type / Hunar</label>
                <select id="service_type" name="service_type" required
                    class="w-full h-12 px-4 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-[#1a7f4b] focus:border-[#1a7f4b] bg-white">
                    <option value="plumber">Plumber / Nalka Theek Karnay Wala</option>
                    <option value="electrician">Electrician / Bijli Ka Kaam</option>
                    <option value="painter">Painter / Rung Karnay Wala</option>
                    <option value="AC technician">AC Technician</option>
                    <option value="carpenter">Carpenter / Lakri Ka Kaam</option>
                </select>
            </div>

            <!-- City Dropdown -->
            <div class="space-y-2">
                <label for="city" class="block text-sm font-bold text-gray-700">City / Shehar</label>
                <select id="city" name="city" required
                    class="w-full h-12 px-4 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-[#1a7f4b] focus:border-[#1a7f4b] bg-white">
                    <option value="Karachi">Karachi</option>
                    <option value="Lahore">Lahore</option>
                    <option value="Islamabad">Islamabad</option>
                    <option value="Rawalpindi">Rawalpindi</option>
                    <option value="Peshawar">Peshawar</option>
                    <option value="Faisalabad">Faisalabad</option>
                    <option value="Multan">Multan</option>
                    <option value="Gujranwala">Gujranwala</option>
                    <option value="Sialkot">Sialkot</option>
                    <option value="Hyderabad">Hyderabad</option>
                    <option value="Quetta">Quetta</option>
                </select>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full h-14 bg-[#1a7f4b] text-white rounded-xl text-md font-bold flex items-center justify-center gap-2 active:scale-95 transition-all shadow-md hover:bg-[#006438]">
                Start Skill Test / Quiz Shuru Karein
                <span class="material-symbols-outlined">arrow_forward</span>
            </button>
        </form>
    </main>

    <!-- Universal Footer -->
    <footer style='text-align:center;font-size:10px;color:#aaaaaa;padding:12px 0 24px;position:absolute;bottom:0;width:100%;'>Powered by Google Pakistan · Innovista · Telenor · Ministry of IT</footer>
</body>
</html>
