<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Service Provider Registration - Mahir</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100dvh; overflow: hidden; }
        .container { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 16px 20px; overflow: hidden; min-height: 0; background: linear-gradient(180deg, #ffffff 0%, #f4faf6 100%); }
        .content { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; overflow-y: auto; padding-right: 4px; }
        .bottom-nav { flex-shrink: 0; padding-bottom: 8px; }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
    </style>
</head>
<body class="font-body-md text-body-md flex flex-col h-dvh max-w-md mx-auto relative overflow-hidden bg-white">
    <!-- Green TopAppBar -->
    <header style='height: 52px; background:#1a7f4b; padding:8px 16px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; border-bottom: 1px solid rgba(0, 0, 0, 0.05); z-index: 10;'>
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='/provider-start'" class="text-white flex items-center justify-center min-h-[48px] min-w-[48px] active:opacity-60 transition-opacity">
                <span class="material-symbols-outlined text-[24px]">arrow_back</span>
            </button>
            <h1 class="text-base font-bold text-white">Provider Registration</h1>
        </div>
        <img src="/static/images/mahir-logo.svg" style="height: 28px; width: auto; object-fit: contain; filter: brightness(0) invert(1);" alt="Mahir Logo">
    </header>

    <div class="container">
        <main class="content">
            <!-- Header section -->
            <div class="text-center space-y-1 animate-fade-in-up flex-shrink-0">
                <h2 class="text-lg font-bold text-[#006438]" style="font-size: 18px;">Apna Profile Banayein</h2>
                <p class="text-xs text-gray-500 font-semibold" style="font-size: 11.5px;">Provide services and start earning. Register in 2 minutes.</p>
            </div>

            <!-- Form -->
            <form action="/provider-skill-test" method="POST" class="bg-white/80 backdrop-blur-md border border-outline-variant/20 rounded-2xl p-4 space-y-4 shadow-sm animate-fade-in-up delay-1">
                <!-- Full Name -->
                <div class="space-y-1.5">
                    <label for="name" class="block text-xs font-bold text-gray-700">Full Name / Pura Naam</label>
                    <input type="text" id="name" name="name" required placeholder="e.g. Ustad Ahmed"
                        class="w-full h-11 px-3 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-[#1a7f4b] focus:border-[#1a7f4b]">
                </div>

                <!-- Phone Number -->
                <div class="space-y-1.5">
                    <label for="phone" class="block text-xs font-bold text-gray-700">Mobile Number / Phone</label>
                    <input type="tel" id="phone" name="phone" required placeholder="e.g. 03001234567"
                        class="w-full h-11 px-3 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-[#1a7f4b] focus:border-[#1a7f4b]">
                </div>

                <!-- Service Type -->
                <div class="space-y-1.5">
                    <label for="service_type" class="block text-xs font-bold text-gray-700">Service Type / Hunar</label>
                    <select id="service_type" name="service_type" required
                        class="w-full h-11 px-3 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-[#1a7f4b] focus:border-[#1a7f4b] bg-white">
                        <option value="plumber">Plumber / Nalka Theek Karnay Wala</option>
                        <option value="electrician">Electrician / Bijli Ka Kaam</option>
                        <option value="painter">Painter / Rung Karnay Wala</option>
                        <option value="AC technician">AC Technician</option>
                        <option value="carpenter">Carpenter / Lakri Ka Kaam</option>
                    </select>
                </div>

                <!-- City -->
                <div class="space-y-1.5">
                    <label for="city" class="block text-xs font-bold text-gray-700">City / Shehar</label>
                    <select id="city" name="city" required
                        class="w-full h-11 px-3 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-[#1a7f4b] focus:border-[#1a7f4b] bg-white">
                        <option value="Karachi">Karachi</option>
                        <option value="Lahore">Lahore</option>
                        <option value="Islamabad" selected>Islamabad</option>
                        <option value="Rawalpindi">Rawalpindi</option>
                        <option value="Peshawar">Peshawar</option>
                        <option value="Faisalabad">Faisalabad</option>
                        <option value="Multan">Multan</option>
                        <option value="Gujranwala">Gujranwala</option>
                    </select>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full h-12 bg-[#1a7f4b] text-white rounded-xl text-sm font-bold flex items-center justify-center gap-2 active:scale-95 transition-all shadow-md hover:bg-[#006438] mt-1">
                    Start Skill Test / Quiz Shuru Karein
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                </button>
            </form>
        </main>

        <!-- Footer -->
        <footer class="bottom-nav flex flex-col gap-1 w-full animate-fade-in-up">
            <div style='text-align:center;font-size:10px;color:#aaaaaa;'>Powered by Google Pakistan · Innovista · Telenor · Ministry of IT</div>
        </footer>
    </div>

    <script>
        function speakUrdu(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ur-PK';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        window.addEventListener('load', () => {
            setTimeout(() => {
                speakUrdu("Apna naam, mobile number aur hunar darj karein taake hum technical test shuru kar sakein.");
            }, 800);
        });
    </script>
</body>
</html>
