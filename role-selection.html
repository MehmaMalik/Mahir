<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary-container": "#a95b00",
                      "on-tertiary-fixed": "#2f1500",
                      "on-tertiary-container": "#fff1e9",
                      "inverse-primary": "#7cda9d",
                      "surface-dim": "#d9dadb",
                      "surface-variant": "#e1e3e4",
                      "on-surface": "#191c1d",
                      "background": "#f8f9fa",
                      "on-primary-container": "#d0ffda",
                      "surface-container-low": "#f3f4f5",
                      "secondary-fixed": "#d3e4ff",
                      "inverse-surface": "#2e3132",
                      "error-container": "#ffdad6",
                      "surface-container-highest": "#e1e3e4",
                      "outline": "#6f7a70",
                      "tertiary": "#854600",
                      "on-primary": "#ffffff",
                      "on-error": "#ffffff",
                      "on-secondary-fixed-variant": "#004881",
                      "surface-container-lowest": "#ffffff",
                      "outline-variant": "#becabe",
                      "on-secondary-fixed": "#001c38",
                      "inverse-on-surface": "#f0f1f2",
                      "on-surface-variant": "#3f4941",
                      "on-tertiary-fixed-variant": "#6e3900",
                      "tertiary-fixed-dim": "#ffb77d",
                      "primary-container": "#1a7f4b",
                      "surface-tint": "#006d3d",
                      "primary-fixed-dim": "#7cda9d",
                      "surface-container": "#edeeef",
                      "secondary-container": "#7db6ff",
                      "surface-bright": "#f8f9fa",
                      "on-secondary": "#ffffff",
                      "tertiary-fixed": "#ffdcc3",

                      "primary": "#006438",
                      "on-secondary-container": "#00477f",
                      "surface-container-high": "#e7e8e9",
                      "on-error-container": "#93000a",
                      "error": "#ba1a1a",
                      "on-background": "#191c1d",
                      "secondary-fixed-dim": "#a2c9ff",
                      "primary-fixed": "#98f6b7",
                      "on-primary-fixed": "#00210f",
                      "on-primary-fixed-variant": "#00522c",
                      "on-tertiary": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-lg": "1.5rem",
                      "margin-main": "1rem",
                      "stack-sm": "0.5rem",
                      "gutter": "0.75rem",
                      "stack-md": "1rem"
              },
              "fontFamily": {
                      "label-sm": ["DM Sans"],
                      "headline-sm": ["DM Sans"],
                      "headline-md": ["DM Sans"],
                      "label-lg": ["DM Sans"],
                      "headline-lg": ["DM Sans"],
                      "body-md": ["DM Sans"],
                      "body-lg": ["DM Sans"]
              },
              "fontSize": {
                      "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                      "headline-sm": ["18px", {"lineHeight": "24px", "fontWeight": "500"}],
                      "headline-md": ["22px", {"lineHeight": "28px", "fontWeight": "500"}],
                      "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500"}],

          },
        }
      </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #ffffff;
            font-family: 'DM Sans', sans-serif;
        }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="antialiased text-on-surface">
<header style='background:#1a7f4b;padding:8px 16px;display:flex;align-items:center;'><img src='/static/images/mahir-logo.svg' height='36' alt='Mahir Logo' style='filter:brightness(0) invert(1);'></header>

<!-- App Bar Suppression Rule Applied (Transactional/Onboarding) -->
<main class="min-h-screen flex flex-col px-margin-main pb-stack-lg pt-12">
<!-- Header Section -->
<header class="text-center mb-stack-lg">
<h1 class="font-headline-lg text-headline-lg font-bold text-primary mb-2">Welcome to Mahir</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Ap kaun hain? — Tell us who you are</p>
</header>
<!-- Role Selection Canvas -->
<div class="flex flex-col gap-stack-md flex-grow">
<!-- Card 1 (Selected State) -->
<button class="relative w-full text-left bg-surface-container-low border-2 border-primary rounded-xl p-4 flex gap-4 items-start transition-all duration-150 active:scale-[0.98]">
<div class="flex-shrink-0 bg-primary-fixed text-primary p-3 rounded-lg">
<span class="material-symbols-outlined" style="font-size: 32px;">person</span>
</div>
<div class="flex-grow">
<div class="flex justify-between items-start mb-1">
<span class="bg-primary/10 text-primary px-3 py-1 rounded-full font-label-sm text-label-sm flex items-center gap-1">
<span class="material-symbols-outlined text-[12px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">shield</span>
                            Customer
                        </span>
<span class="material-symbols-outlined text-primary" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-1">I need a service</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Looking for a plumber, electrician, painter or other skilled worker</p>
</div>
</button>
<!-- Card 2 (Unselected State) -->
<button class="w-full text-left bg-surface-container-low border-2 border-outline-variant rounded-xl p-4 flex gap-4 items-start transition-all duration-150 active:scale-[0.98] hover:border-outline">
<div class="flex-shrink-0 bg-secondary-fixed text-secondary p-3 rounded-lg">
<span class="material-symbols-outlined" style="font-size: 32px;">handyman</span>
</div>
<div class="flex-grow">
<div class="flex justify-between items-start mb-1">
<span class="bg-secondary/10 text-secondary px-3 py-1 rounded-full font-label-sm text-label-sm flex items-center gap-1">
<span class="material-symbols-outlined text-[12px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">award_star</span>
                            Service provider
                        </span>
</div>
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-1">I provide services</h3>
<p class="font-body-md text-body-md text-on-surface-variant">I am a plumber, electrician or skilled worker looking for work</p>
</div>
</button>
<!-- Info Box -->
<div class="mt-4 bg-primary-container/10 border-l-4 border-primary p-4 rounded-lg flex gap-3">
<span class="material-symbols-outlined text-primary">info</span>
<p class="font-body-md text-body-md text-on-surface-variant leading-tight">
                    Service providers — register via a simple phone call in Urdu. No app download needed.
                </p>
</div>
</div>
<!-- Sticky Footer Action -->
<footer class="mt-stack-lg pt-4">
<button class="w-full bg-primary-container text-on-primary-container py-4 rounded-xl font-headline-sm text-headline-sm font-bold flex justify-center items-center gap-2 active:opacity-80 transition-opacity" onclick="window.location.href='/language-selection'">
                Continue as Customer
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center font-label-sm text-label-sm text-on-surface-variant mt-4">By continuing, you agree to Mahir's Terms &amp; Privacy Policy</p>
</footer>
</main>
<!-- Navigation Shell Suppressed: Role selection is a transactional/onboarding step -->

<footer style='text-align:center;font-size:10px;color:#aaaaaa;padding:12px 0 24px;'>Powered by Google Pakistan · Innovista · Telenor · Ministry of IT</footer>
</body></html>
