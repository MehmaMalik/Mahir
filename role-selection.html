<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary-container": "#a95b00",
                      "on-tertiary-fixed": "#2f1500",
                      "on-tertiary-container": "#fff1e9",
                      "inverse-primary": "#7cda9d",
                      "surface-dim": "#d9dadb",
                      "surface-variant": "#e1e3e4",
                      "on-surface": "#191c1d",
                      "background": "#f8f9fa",
                      "on-primary-container": "#d0ffda",
                      "surface-container-low": "#f3f4f5",
                      "secondary-fixed": "#d3e4ff",
                      "inverse-surface": "#2e3132",
                      "error-container": "#ffdad6",
                      "surface-container-highest": "#e1e3e4",
                      "outline": "#6f7a70",
                      "tertiary": "#854600",
                      "on-primary": "#ffffff",
                      "on-error": "#ffffff",
                      "on-secondary-fixed-variant": "#004881",
                      "surface-container-lowest": "#ffffff",
                      "outline-variant": "#becabe",
                      "on-secondary-fixed": "#001c38",
                      "inverse-on-surface": "#f0f1f2",
                      "on-surface-variant": "#3f4941",
                      "on-tertiary-fixed-variant": "#6e3900",
                      "tertiary-fixed-dim": "#ffb77d",
                      "primary-container": "#1a7f4b",
                      "surface-tint": "#006d3d",
                      "primary-fixed-dim": "#7cda9d",
                      "surface-container": "#edeeef",
                      "secondary-container": "#7db6ff",
                      "surface-bright": "#f8f9fa",
                      "on-secondary": "#ffffff",
                      "tertiary-fixed": "#ffdcc3",
                      "surface": "#f8f9fa",
                      "secondary": "#1960a3",
                      "primary": "#006438",
                      "on-secondary-container": "#00477f",
                      "surface-container-high": "#e7e8e9",
                      "on-error-container": "#93000a",
                      "error": "#ba1a1a",
                      "on-background": "#191c1d",
                      "secondary-fixed-dim": "#a2c9ff",
                      "primary-fixed": "#98f6b7",
                      "on-primary-fixed": "#00210f",
                      "on-primary-fixed-variant": "#00522c",
                      "on-tertiary": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-lg": "1.5rem",
                      "margin-main": "1rem",
                      "stack-sm": "0.5rem",
                      "gutter": "0.75rem",
                      "stack-md": "1rem"
              },
              "fontFamily": {
                      "label-sm": ["DM Sans"],
                      "headline-sm": ["DM Sans"],
                      "headline-md": ["DM Sans"],
                      "label-lg": ["DM Sans"],
                      "headline-lg": ["DM Sans"],
                      "body-md": ["DM Sans"],
                      "body-lg": ["DM Sans"]
              },
              "fontSize": {
                      "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                      "headline-sm": ["18px", {"lineHeight": "24px", "fontWeight": "500"}],
                      "headline-md": ["22px", {"lineHeight": "28px", "fontWeight": "500"}],
                      "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500"}],
                      "headline-lg": ["28px", {"lineHeight": "36px", "fontWeight": "500"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
              }
            },
          },
        }
      </script>
<style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        .container { height: calc(100vh - 52px); display: flex; flex-direction: column; justify-content: space-between; padding: 15px 20px; overflow: hidden; }
        .content { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; gap: 12px; overflow: hidden; }
        .bottom-nav { flex: 0; padding-bottom: 10px; }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #ffffff;
            color: #191c1d;
            font-family: 'DM Sans', sans-serif;
        }
        * {
            box-shadow: none !important;
        }
    </style>
</head>
<body class="font-body-md text-body-md flex flex-col h-screen max-w-md mx-auto relative overflow-hidden bg-white">
<header style='height: 52px; background:#1a7f4b; padding:8px 16px; display:flex; align-items:center; flex-shrink:0;'>
  <img src='/static/images/mahir-logo-white.svg' height='36' alt='Mahir Logo'>
</header>

<div class="container bg-surface-container-lowest">
<!-- Content Canvas -->
<main class="content">
<!-- Header Section -->
<section class="text-center my-1 flex-shrink-0">
<h1 class="text-xl font-bold text-primary mb-1" style="font-size: 21.6px; line-height: 28px;">Welcome to Mahir</h1>
<p class="text-sm text-on-surface-variant" style="font-size: 14.4px; line-height: 20px;">Ap kaun hain? — Tell us who you are</p>
</section>

<!-- Role Selection Canvas -->
<div class="flex flex-col gap-3 flex-grow justify-center">
<!-- Card 1 (Selected State) -->
<button class="relative w-full text-left bg-surface-container-low border-2 border-primary rounded-xl p-3 flex gap-3 items-start transition-all duration-150 active:scale-[0.98]">
<div class="flex-shrink-0 bg-primary-fixed text-primary p-2 rounded-lg">
<span class="material-symbols-outlined" style="font-size: 28px;">person</span>
</div>
<div class="flex-grow">
<div class="flex justify-between items-start mb-0.5">
<span class="bg-primary/10 text-primary px-2 py-0.5 rounded-full font-label-sm text-label-sm flex items-center gap-1" style="font-size: 10.8px;">
<span class="material-symbols-outlined text-[10px]" style="font-variation-settings: 'FILL' 1;">shield</span>
                            Customer
                        </span>
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h3 class="text-base font-bold text-on-surface mb-0.5" style="font-size: 16.2px; line-height: 22px;">I need a service</h3>
<p class="text-xs text-on-surface-variant" style="font-size: 12.6px; line-height: 16px;">Looking for a plumber, electrician, painter or other skilled worker</p>
</div>
</button>
<!-- Card 2 (Unselected State) -->
<button onclick="window.location.href='/provider-start'" class="w-full text-left bg-surface-container-low border-2 border-outline-variant rounded-xl p-3 flex gap-3 items-start transition-all duration-150 active:scale-[0.98] hover:border-outline cursor-pointer">
<div class="flex-shrink-0 bg-secondary-fixed text-secondary p-2 rounded-lg">
<span class="material-symbols-outlined" style="font-size: 28px;">handyman</span>
</div>
<div class="flex-grow">
<div class="flex justify-between items-start mb-0.5">
<span class="bg-secondary/10 text-secondary px-2 py-0.5 rounded-full font-label-sm text-label-sm flex items-center gap-1" style="font-size: 10.8px;">
<span class="material-symbols-outlined text-[10px]" style="font-variation-settings: 'FILL' 1;">award_star</span>
                            Service provider
                        </span>
</div>
<h3 class="text-base font-bold text-on-surface mb-0.5" style="font-size: 16.2px; line-height: 22px;">I provide services</h3>
<p class="text-xs text-on-surface-variant" style="font-size: 12.6px; line-height: 16px;">I am a plumber, electrician or skilled worker looking for work</p>
</div>
</button>
<!-- Info Box -->
<div class="bg-primary-container/10 border-l-4 border-primary p-3 rounded-lg flex gap-3 items-center">
<span class="material-symbols-outlined text-primary flex-shrink-0">info</span>
<p class="text-xs text-on-surface-variant leading-tight" style="font-size: 11.7px;">
                    Service providers — register via a simple phone call in Urdu. No app download needed.
                </p>
</div>
</div>
</main>
<!-- Sticky Footer Action -->
<footer class="bottom-nav flex flex-col gap-3 bg-surface-container-lowest w-full flex-shrink-0">
<button class="w-full bg-primary-container text-on-primary-container py-3 rounded-xl font-bold flex justify-center items-center gap-2 active:opacity-80 transition-opacity" style="font-size: 16.2px;" onclick="window.location.href='/home'">
                Continue as Customer
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center font-label-sm text-label-sm text-on-surface-variant" style="font-size: 10.8px;">By continuing, you agree to Mahir's Terms &amp; Privacy Policy</p>
<div style='text-align:center;font-size:10px;color:#aaaaaa;padding-top:4px;'>Powered by Google Pakistan · Innovista · Telenor · Ministry of IT</div>
</footer>
</div>
</body></html>
